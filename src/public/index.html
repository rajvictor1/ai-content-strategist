<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Strategist - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-light: #334155;
            --border: #334155;
            --border-light: #475569;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --primary: #667eea;
            --primary-hover: #7c8ff0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }
        /* Left sidebar */
        .sidebar {
            width: 280px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 100;
        }
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            font-size: 18px;
            color: #f1f5f9;
            margin-bottom: 6px;
        }
        .sidebar-header p {
            font-size: 12px;
            color: var(--text-dim);
        }
        .nav-menu {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
            border: 1px solid transparent;
        }
        .nav-item:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: var(--border-light);
        }
        .nav-item.active {
            background: rgba(102, 126, 234, 0.2);
            border-color: var(--primary);
        }
        .nav-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--panel-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .nav-item.active .nav-icon {
            background: var(--primary);
        }
        .nav-content {
            flex: 1;
        }
        .nav-title {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
        }
        .nav-desc {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }
        .nav-count {
            font-size: 12px;
            font-weight: bold;
            color: var(--primary);
            background: rgba(102, 126, 234, 0.15);
            padding: 2px 8px;
            border-radius: 12px;
        }
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-dim);
        }

        /* Main content */
        .main {
            margin-left: 280px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .topbar {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .topbar h2 {
            font-size: 20px;
            font-weight: 600;
        }
        .topbar .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-dim);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .content {
            padding: 32px;
            flex: 1;
        }
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .metric-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .metric-card .number {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
        }
        .metric-card .label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 6px;
        }
        .phase-view {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            min-height: 500px;
        }
        .phase-view h3 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #f1f5f9;
        }
        .phase-view .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder { color: #64748b; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .button-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-secondary {
            background: var(--panel-light);
            color: var(--text);
            border: 1px solid var(--border-light);
        }
        .btn-secondary:hover:not(:disabled) { background: var(--border-light); }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .output-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            min-height: 200px;
            max-height: 600px;
            overflow-y: auto;
            display: none;
        }
        .output-box.show { display: block; }
        .output-box.success { border-color: var(--success); }
        .output-box.error { border-color: var(--danger); }
        .output-box.info { border-color: var(--warning); }
        .result-item {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .result-item h4 {
            color: var(--primary);
            font-size: 16px;
            margin-bottom: 8px;
        }
        .result-item p {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 4px;
        }
        .token-cost {
            margin-top: 15px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 6px;
            font-size: 13px;
            color: var(--primary);
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .info-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--warning);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        @media (max-width: 1024px) {
            .metrics-row { grid-template-columns: repeat(3, 1fr); }
            .form-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; height: auto; }
            .main { margin-left: 0; }
            body { flex-direction: column; }
            .metrics-row { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>🤖 AI Content Strategist</h1>
            <p>From keyword to published content</p>
        </div>
        <div class="nav-menu" id="navMenu">
            <!-- Nav items generated by JS -->
        </div>
        <div class="sidebar-footer">
            <div id="connectionStatus">Checking connection...</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="topbar">
            <h2 id="pageTitle">Dashboard</h2>
            <div class="status">
                <span class="status-dot"></span>
                <span id="totalTokens">0 tokens used</span>
            </div>
        </div>

        <div class="content">
            <div class="metrics-row" id="metricsRow">
                <!-- Metrics generated by JS -->
            </div>

            <div class="phase-view" id="phaseView">
                <!-- Active phase content generated by JS -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';

        const phases = [
            {
                id: 'dashboard',
                icon: '📊',
                title: 'Dashboard',
                desc: 'Overview & metrics',
                countField: null
            },
            {
                id: 'phase1',
                icon: '🔍',
                title: 'Phase 1: Keyword Discovery',
                desc: 'Find target keywords',
                countField: 'keywords'
            },
            {
                id: 'phase2',
                icon: '🏛️',
                title: 'Phase 2: Pillar Mapping',
                desc: 'Group keywords into pillars',
                countField: 'pillars'
            },
            {
                id: 'phase3',
                icon: '📝',
                title: 'Phase 3: Topic Generation',
                desc: 'Generate article topics',
                countField: 'topics'
            },
            {
                id: 'phase4',
                icon: '✍️',
                title: 'Phase 4: Article Generation',
                desc: 'Write full articles',
                countField: 'articles'
            },
            {
                id: 'phase5',
                icon: '🎯',
                title: 'Phase 5: Competitor Analysis',
                desc: 'Analyze competitor pages',
                countField: 'competitors'
            },
            {
                id: 'phase6',
                icon: '🔗',
                title: 'Phase 6: Internal Linking',
                desc: 'Generate internal links',
                countField: 'links'
            }
        ];

        let currentPhase = 'dashboard';
        let metrics = {};

        function renderNav() {
            const menu = document.getElementById('navMenu');
            menu.innerHTML = phases.map(phase => {
                const count = phase.countField ? (metrics[phase.countField] || 0) : '';
                const active = phase.id === currentPhase ? 'active' : '';
                return `
                    <div class="nav-item ${active}" onclick="setPhase('${phase.id}')">
                        <div class="nav-icon">${phase.icon}</div>
                        <div class="nav-content">
                            <div class="nav-title">${phase.title}</div>
                            <div class="nav-desc">${phase.desc}</div>
                        </div>
                        ${count !== '' ? `<div class="nav-count">${count}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function renderMetrics() {
            const row = document.getElementById('metricsRow');
            const items = [
                { label: 'Keywords', value: metrics.keywords || 0 },
                { label: 'Pillars', value: metrics.pillars || 0 },
                { label: 'Topics', value: metrics.topics || 0 },
                { label: 'Articles', value: metrics.articles || 0 },
                { label: 'Competitors', value: metrics.competitors || 0 },
                { label: 'Links', value: metrics.links || 0 }
            ];
            row.innerHTML = items.map(item => `
                <div class="metric-card">
                    <div class="number">${item.value}</div>
                    <div class="label">${item.label}</div>
                </div>
            `).join('');
        }

        function setPhase(phaseId) {
            currentPhase = phaseId;
            const phase = phases.find(p => p.id === phaseId);
            document.getElementById('pageTitle').textContent = phase.title;
            renderNav();
            renderPhaseContent();
        }

        function renderPhaseContent() {
            const view = document.getElementById('phaseView');
            const handlers = {
                dashboard: renderDashboard,
                phase1: renderPhase1,
                phase2: renderPhase2,
                phase3: renderPhase3,
                phase4: renderPhase4,
                phase5: renderPhase5,
                phase6: renderPhase6
            };
            handlers[currentPhase]();
        }

        function renderDashboard() {
            document.getElementById('phaseView').innerHTML = `
                <h3>Welcome to AI Content Strategist</h3>
                <p class="subtitle">Follow the 6 phases on the left to go from topic idea to a complete content strategy.</p>
                <div class="info-box">
                    💡 Start with Phase 1: enter a topic and audience, then click Search Keywords.
                </div>
                <div class="empty-state">
                    <div class="icon">🚀</div>
                    <p>Select a phase from the left sidebar to begin.</p>
                </div>
            `;
        }

        function renderPhase1() {
            document.getElementById('phaseView').innerHTML = `
                <h3>Phase 1: Keyword Discovery</h3>
                <p class="subtitle">Enter your core topic and target audience. AI will discover related keywords.</p>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Topic / Seed Keyword</label>
                        <input type="text" id="phase1Topic" placeholder="e.g., AI automation tools" value="AI automation tools">
                    </div>
                    <div class="form-group">
                        <label>Target Audience</label>
                        <input type="text" id="phase1Audience" placeholder="e.g., business owners" value="business owners">
                    </div>
                    <div class="form-group">
                        <label>Number of Keywords</label>
                        <input type="number" id="phase1Count" value="10" min="5" max="25">
                    </div>
                </div>
                <div class="button-row">
                    <button class="btn-primary" onclick="runPhase1()">
                        <span id="phase1Loading"></span> Search Keywords
                    </button>
                    <button class="btn-secondary" onclick="viewKeywords()">
                        <span id="phase1ViewLoading"></span> View Saved Keywords
                    </button>
                </div>
                <div id="phase1Output" class="output-box"></div>
            `;
        }

        function renderPhase2() {
            document.getElementById('phaseView').innerHTML = `
                <h3>Phase 2: Pillar Mapping</h3>
                <p class="subtitle">Group your keywords into content pillars.</p>
                <div class="info-box">ℹ️ Run this after you have keywords from Phase 1.</div>
                <div class="button-row">
                    <button class="btn-primary" onclick="runPhase2()">
                        <span id="phase2Loading"></span> Organize into Pillars
                    </button>
                    <button class="btn-secondary" onclick="viewPillars()">
                        <span id="phase2ViewLoading"></span> View Pillars
                    </button>
                </div>
                <div id="phase2Output" class="output-box"></div>
            `;
        }

        function renderPhase3() {
            document.getElementById('phaseView').innerHTML = `
                <h3>Phase 3: Topic Generation</h3>
                <p class="subtitle">Generate TOFU, MOFU, and BOFU topics for each keyword.</p>
                <div class="info-box">ℹ️ Keywords must be assigned to pillars first (Phase 2).</div>
                <div class="button-row">
                    <button class="btn-primary" onclick="runPhase3()">
                        <span id="phase3Loading"></span> Generate All Topics
                    </button>
                    <button class="btn-secondary" onclick="viewTopics()">
                        <span id="phase3ViewLoading"></span> View Topics
                    </button>
                </div>
                <div id="phase3Output" class="output-box"></div>
            `;
        }

        function renderPhase4() {
            document.getElementById('phaseView').innerHTML = `
                <h3>Phase 4: Article Generation</h3>
                <p class="subtitle">Write full articles from each topic.</p>
                <div class="info-box">ℹ️ Generate topics in Phase 3 first.</div>
                <div class="button-row">
                    <button class="btn-primary" onclick="runPhase4()">
                        <span id="phase4Loading"></span> Generate All Articles
                    </button>
                    <button class="btn-secondary" onclick="viewArticles()">
                        <span id="phase4ViewLoading"></span> View Articles
                    </button>
                </div>
                <div id="phase4Output" class="output-box"></div>
            `;
        }

        function renderPhase5() {
            document.getElementById('phaseView').innerHTML = `
                <h3>Phase 5: Competitor Analysis</h3>
                <p class="subtitle">Analyze competitor pages for any article.</p>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Article ID</label>
                        <input type="text" id="phase5ArticleId" placeholder="Paste article ID from Phase 4">
                    </div>
                    <div class="form-group full-width">
                        <label>Competitor URLs (comma separated)</label>
                        <input type="text" id="phase5Urls" placeholder="https://zapier.com/blog/ai-automation, https://www.make.com/en/blog/ai-automation">
                    </div>
                </div>
                <div class="button-row">
                    <button class="btn-primary" onclick="runPhase5()">
                        <span id="phase5Loading"></span> Analyze Competitors
                    </button>
                </div>
                <div id="phase5Output" class="output-box"></div>
            `;
        }

        function renderPhase6() {
            document.getElementById('phaseView').innerHTML = `
                <h3>Phase 6: Internal Linking</h3>
                <p class="subtitle">Generate internal links between articles in the same pillar.</p>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Pillar ID</label>
                        <input type="text" id="phase6PillarId" placeholder="Paste pillar ID from Phase 2">
                    </div>
                </div>
                <div class="button-row">
                    <button class="btn-primary" onclick="runPhase6()">
                        <span id="phase6Loading"></span> Generate Links
                    </button>
                </div>
                <div id="phase6Output" class="output-box"></div>
            `;
        }

        // Helpers
        function showOutput(id, html, type = 'info') {
            const el = document.getElementById(id);
            el.innerHTML = html;
            el.className = 'output-box show ' + type;
        }

        function setLoading(id, loading = true) {
            const el = document.getElementById(id);
            if (el) el.innerHTML = loading ? '<span class="loading"></span>' : '';
        }

        async function apiCall(method, path, body = null) {
            const url = `${API_BASE}${path}`;
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(url, options);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            return data;
        }

        async function updateMetrics() {
            try {
                const data = await apiCall('GET', '/project/progress');
                metrics = data.totals || {};
                const tokens = data.project?.totalTokens || 0;
                document.getElementById('totalTokens').textContent = `${tokens.toLocaleString()} tokens used`;
                renderNav();
                renderMetrics();
            } catch (e) {
                console.error('Metrics error:', e);
            }
        }

        async function checkHealth() {
            try {
                const res = await fetch(window.location.origin + '/health');
                const data = await res.json();
                document.getElementById('connectionStatus').innerHTML = `✅ ${data.database || 'connected'}`;
            } catch (e) {
                document.getElementById('connectionStatus').innerHTML = '❌ API unreachable';
            }
        }

        // Phase 1
        async function runPhase1() {
            const topic = document.getElementById('phase1Topic').value.trim();
            const audience = document.getElementById('phase1Audience').value.trim();
            const count = parseInt(document.getElementById('phase1Count').value) || 10;
            if (!topic) return alert('Please enter a topic');
            setLoading('phase1Loading', true);
            try {
                const data = await apiCall('POST', '/keywords/search', { topic, audience, count });
                let html = `<strong>Created ${data.keywordsCreated} keywords:</strong><br><br>`;
                (data.keywords || []).forEach(k => {
                    html += `<div class="result-item">
                        <h4>${k.keyword}</h4>
                        <p>Volume: ${k.volume || 0} | Difficulty: ${k.difficulty || 0} | Intent: ${k.intent || 'N/A'}</p>
                    </div>`;
                });
                showOutput('phase1Output', html, 'success');
                await updateMetrics();
            } catch (err) {
                showOutput('phase1Output', `<strong>Error:</strong> ${err.message}`, 'error');
            }
            setLoading('phase1Loading', false);
        }

        async function viewKeywords() {
            setLoading('phase1ViewLoading', true);
            try {
                const data = await apiCall('GET', '/keywords');
                let html = `<strong>Saved Keywords (${data.count}):</strong><br><br>`;
                if (!data.keywords?.length) html += 'No keywords found yet.';
                (data.keywords || []).forEach(k => {
                    html += `<div class="result-item">
                        <h4>${k.keyword}</h4>
                        <p>Volume: ${k.searchVolume || 0} | Difficulty: ${k.difficulty || 0} | Intent: ${k.intent || 'N/A'}</p>
                        <p>Pillar: ${k.pillar?.title || 'Not assigned'}</p>
                    </div>`;
                });
                showOutput('phase1Output', html, 'success');
            } catch (err) {
                showOutput('phase1Output', `<strong>Error:</strong> ${err.message}`, 'error');
            }
            setLoading('phase1ViewLoading', false);
        }

        // Phase 2
        async function runPhase2() {
            setLoading('phase2Loading', true);
            try {
                const data = await apiCall('POST', '/keywords/organize-pillars', {});
                let html = `<strong>Created ${data.pillarsCreated} pillars:</strong><br><br>`;
                (data.pillars || []).forEach(p => {
                    html += `<div class="result-item">
                        <h4>${p.title}</h4>
                        <p>${p.description || 'No description'}</p>
                        <p>Authority: ${p.authority || 0}</p>
                    </div>`;
                });
                showOutput('phase2Output', html, 'success');
                await updateMetrics();
            } catch (err) {
                showOutput('phase2Output', `<strong>Error:</strong> ${err.message}`, 'error');
            }
            setLoading('phase2Loading', false);
        }

        async function viewPillars() {
            setLoading('phase2ViewLoading', true);
            try {
                const data = await apiCall('GET', '/pillars');
                let html = `<strong>Saved Pillars (${data.count || data.pillars?.length || 0}):</strong><br><br>`;
                if (!data.pillars?.length) html += 'No pillars found yet.';
                (data.pillars || []).forEach(p => {
                    html += `<div class="result-item">
                        <h4>${p.title}</h4>
                        <p>${p.description || 'No description'}</p>
                        <p>Authority: ${p.authority || 0} | Keywords: ${p.keywords?.length || 0}</p>
                        <p style="font-size:11px;color:#64748b">ID: ${p.id}</p>
                    </div>`;
                });
                showOutput('phase2Output', html, 'success');
            } catch (err) {
                showOutput('phase2Output', `<strong>Error:</strong> ${err.message}`, 'error');
            }
            setLoading('phase2ViewLoading', false);
        }

        // Phase 3
        async function runPhase3() {
            setLoading('phase3Loading', true);
            try {
                const keywords = await apiCall('GET', '/keywords');
                if (!keywords.keywords?.length) throw new Error('No keywords found. Run Phase 1 first.');
                let created = 0;
                let errors = 0;
                for (const kw of keywords.keywords) {
                    try {
                        const res = await apiCall('POST', '/topics/generate', { keywordId: kw.id });
                        created += res.topicsCreated || 0;
                    } catch (e) { errors++; }
                }
                showOutput('phase3Output', `<strong>Generated ${created} topics (${errors} skipped/failed).</strong> Click View Topics to see them.`, 'success');
                await updateMetrics();
                await viewTopics();
            } catch (err) {
                showOutput('phase3Output', `<strong>Error:</strong> ${err.message}`, 'error');
            }
            setLoading('phase3Loading', false);
        }

        async function viewTopics() {
            setLoading('phase3ViewLoading', true);
            try {
                const data = await apiCall('GET', '/topics');
                let html = `<strong>Saved Topics (${data.count}):</strong><br><br>`;
                if (!data.topics?.length) html += 'No topics found yet.';
                (data.topics || []).forEach(t => {
                    html += `<div class="result-item">
                        <h4>${t.title}</h4>
                        <p>Stage: ${t.stage} | Keyword: ${t.keyword?.keyword || 'N/A'} | Pillar: ${t.pillar?.title || 'None'}</p>
                        <p>${t.outline?.substring(0, 200) || 'No outline'}...</p>
                    </div>`;
                });
                showOutput('phase3Output', html, 'success');
            } catch (err) {
                showOutput('phase3Output', `<strong>Error:</strong> ${err.message}`, 'error');
            }
            setLoading('phase3ViewLoading', false);
        }

        // Phase 4
        async function runPhase4() {
            setLoading('phase4Loading', true);
            try {
                const topics = await apiCall('GET', '/topics');
                if (!topics.topics?.length) throw new Error('No topics found. Run Phase 3 first.');
                let created = 0;
                let errors = 0;
                for (const t of topics.topics) {
                    try {
                        await apiCall('POST', '/articles/generate', { topicId: t.id });
                        created++;
                    } catch (e) { errors++; }
                }
                showOutput('phase4Output', `<strong>Generated ${created} articles (${errors} skipped/failed).</strong> Click View Articles to see them.`, 'success');
                await updateMetrics();
                await viewArticles();
            } catch (err) {
                showOutput('phase4Output', `<strong>Error:</strong> ${err.message}`, 'error');
            }
            setLoading('phase4Loading', false);
        }

        async function viewArticles() {
            setLoading('phase4ViewLoading', true);
            try {
                const data = await apiCall('GET', '/articles');
                let html = `<strong>Saved Articles (${data.count}):</strong><br><br>`;
                if (!data.articles?.length) html += 'No articles found yet.';
                (data.articles || []).forEach(a => {
                    html += `<div class="result-item">
                        <h4>${a.title}</h4>
                        <p>Slug: ${a.slug} | Words: ${a.wordCount || 0} | Status: ${a.status}</p>
                        <p>${a.summary ? a.summary.substring(0, 150) + '...' : (a.content?.substring(0, 150) + '...' || 'No content')}</p>
                        <p style="font-size:11px;color:#64748b">ID: ${a.id}</p>
                    </div>`;
                });
                showOutput('phase4Output', html, 'success');
            } catch (err) {
                showOutput('phase4Output', `<strong>Error:</strong> ${err.message}`, 'error');
            }
            setLoading('phase4ViewLoading', false);
        }

        // Phase 5
        async function runPhase5() {
            const articleId = document.getElementById('phase5ArticleId').value.trim();
            const urlsRaw = document.getElementById('phase5Urls').value.trim();
            if (!articleId || !urlsRaw) return alert('Please enter article ID and competitor URLs');
            const competitors = urlsRaw.split(',').map(u => u.trim()).filter(Boolean).map((url, idx) => ({
                url,
                title: url.replace(/^https?:\/\//, '').split('/')[0],
                rank: idx + 1
            }));
            setLoading('phase5Loading', true);
            try {
                const data = await apiCall('POST', '/competitors/analyze', { articleId, competitors });
                let html = `<strong>Analyzed ${data.competitors?.length || 0} competitors:</strong><br><br>`;
                (data.competitors || []).forEach(c => {
                    html += `<div class="result-item">
                        <h4>${c.title || c.url}</h4>
                        <p>Rank: ${c.rank} | Authority: ${c.authority || 'N/A'} | Domain: ${c.domain}</p>
                        <p><strong>Strengths:</strong> ${c.strengths || 'N/A'}</p>
                        <p><strong>Weaknesses:</strong> ${c.weaknesses || 'N/A'}</p>
                    </div>`;
                });
                showOutput('phase5Output', html, 'success');
                await updateMetrics();
            } catch (err) {
                showOutput('phase5Output', `<strong>Error:</strong> ${err.message}`, 'error');
            }
            setLoading('phase5Loading', false);
        }

        // Phase 6
        async function runPhase6() {
            const pillarId = document.getElementById('phase6PillarId').value.trim();
            if (!pillarId) return alert('Please enter a pillar ID');
            setLoading('phase6Loading', true);
            try {
                const data = await apiCall('POST', '/links/generate', { pillarId });
                let html = `<strong>Generated ${data.links?.length || 0} internal links:</strong><br><br>`;
                (data.links || []).forEach(l => {
                    html += `<div class="result-item">
                        <h4>${l.sourceArticle?.title || l.sourceId} → ${l.targetArticle?.title || l.targetId}</h4>
                        <p>Anchor: "${l.anchorText}" | Type: ${l.type}</p>
                    </div>`;
                });
                showOutput('phase6Output', html, 'success');
                await updateMetrics();
            } catch (err) {
                showOutput('phase6Output', `<strong>Error:</strong> ${err.message}`, 'error');
            }
            setLoading('phase6Loading', false);
        }

        // Init
        window.addEventListener('load', () => {
            renderNav();
            renderMetrics();
            renderPhaseContent();
            checkHealth();
            updateMetrics();
            setInterval(updateMetrics, 5000);
        });
    </script>
</body>
</html>
